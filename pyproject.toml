[project]
name = "chonkconf"
version = "1.2.0"
description = "A tiny TOML config loader with computed values. A demo library: don't use it in production."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Confidence Okoghenun" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chonkconf"]
